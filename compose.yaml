services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nosql_final_project
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env or your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
